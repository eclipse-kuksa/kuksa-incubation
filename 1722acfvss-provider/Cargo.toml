[package]
name = "open1722-kuksa-provider"
version = "0.1.0"
edition = "2024"
description = "A KUKSA Databroker provider that bridges Open1722 ACF-VSS data to VSS signals"
license = "Apache-2.0"

[[bin]]
name = "open1722-kuksa-provider"
path = "src/main.rs"

[[bin]]
name = "acf-vss-gateway"
path = "src/main_gateway.rs"

[dependencies]
kuksa-rust-sdk = "0.2.2"
tokio = { version = "1", features = ["full"] }
log = "0.4"
env_logger = "0.11"
clap = { version = "4", features = ["derive", "env"] }
thiserror = "2"
libc = "0.2"
csv = "1.3"
serde = { version = "1", features = ["derive"] }
open1722 = "=0.9.4"
