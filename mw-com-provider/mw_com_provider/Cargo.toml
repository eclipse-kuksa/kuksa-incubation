[package]
name = "mw_com_provider"
version = "0.1.0"
edition = "2021"
build = "build.rs"

[features]
default = ["mock-transport"]
mock-transport = []
score-lola = ["dep:score_com"]

[dependencies]
async-trait = "0.1.82"
databroker = { path = "../databroker", default-features = false }
databroker-proto = { path = "../databroker-proto" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "1.0.47"
tokio = { version = "1.46.1", features = ["sync", "time"] }
tokio-stream = "0.1"
tracing = "0.1.34"
score_com = { path = "score_com_cargo/score_com", optional = true }

[dev-dependencies]
tokio = { version = "1.46.1", features = ["macros", "rt"] }
