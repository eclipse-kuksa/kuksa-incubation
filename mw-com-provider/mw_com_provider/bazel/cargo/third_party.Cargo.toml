[package]
name = "mw_com_provider_bazel_third_party"
version = "0.1.0"
edition = "2021"

[lib]
path = "empty.rs"

[dependencies]
async-trait = "0.1.82"
glob-match = "0.2.1"
indexmap = "2.8.0"
lazy_static = "1.4.0"
regex = "1.7.1"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "1.0.47"
tokio = { version = "1.46.1", features = ["macros", "rt", "rt-multi-thread", "signal", "sync", "time"] }
tokio-stream = { version = "0.1.8", features = ["sync"] }
tracing = "0.1.34"
uuid = { version = "1.4.1", features = ["v4"] }