[project]
name = "rosetta-vss"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "cantools>=41.0.1",
    "hf-xet>=1.2.0",
    "huggingface-hub>=0.36.0",
    "lxml>=6.0.2",
    "matplotlib>=3.10.8",
    "openpyxl>=3.1.5",
    "pandas>=2.3.3",
    "pyyaml>=6.0.3",
    "rank-bm25>=0.2.2",
    "requests>=2.32.5",
    "sentence-transformers>=5.1.2",
    "streamlit>=1.51.0",
    "streamlit-agraph>=0.0.45",
    "torch==2.8.0",
]

# concept from: https://docs.astral.sh/uv/concepts/build-backend/#the-uv-build-backend
[build-system]
requires = ["uv_build>=0.9.26,<0.10.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-root = ""
module-name = ["vss_mapper", "app_modules"]
