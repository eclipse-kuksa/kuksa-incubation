name: kuksa_dart_client

on:
  push:
  pull_request:
    paths:
      - ".github/workflows/kuksa_dart_client.yaml"
      - "kuksa_dart_client/**"
  workflow_dispatch:

concurrency:
  group: ${{ github.ref }}-${{ github.workflow }}
  cancel-in-progress: true

jobs:

  kuksa-dart-client-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout kuksa-incubation
        uses: actions/checkout@v4
      - uses: dart-lang/setup-dart@v1
      - run: dart --version
      - name: Analyze and test
        run: |
          cd kuksa_dart_client
          dart pub get
          dart analyze
          dart test
